    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#14213D" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0d12" media="(prefers-color-scheme: dark)" />
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var theme = localStorage.getItem('fahim-theme') || 'system';
          var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var effective = dark ? 'dark' : 'light';
          root.classList.toggle('dark', dark);
          root.style.colorScheme = effective;
          root.dataset.theme = effective;
          var language = localStorage.getItem('fahim-language') === 'en' ? 'en' : 'ar';
          root.lang = language;
          root.dir = language === 'ar' ? 'rtl' : 'ltr';
          root.dataset.lowBandwidth = String(localStorage.getItem('fahim-low-bandwidth') === 'true');
        } catch (error) {
          /* Storage can be blocked; the app re-applies theme and language after mount. */
        }
      })();
    </script>
